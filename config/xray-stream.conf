# AYAH ALMA: raw TCP TLS proxy (Nginx stream / TLS passthrough)
# Public TCP ports 10011-10013 map to Xray's loopback-only TLS inbounds 10001-10003.
# These are separate ports because Nginx HTTP TLS already owns public port 443.
server {
    listen 10011;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_pass 127.0.0.1:10001;
}

server {
    listen 10012;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_pass 127.0.0.1:10002;
}

server {
    listen 10013;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_pass 127.0.0.1:10003;
}

# SSH SSL-only (tanpa WebSocket): TLS diteruskan ke stunnel lokal.
# Port publik 444 dipakai agar HTTPS Nginx tetap utuh pada port 443.
server {
    listen 444;
    listen [::]:444;
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_pass 127.0.0.1:2222;
}
