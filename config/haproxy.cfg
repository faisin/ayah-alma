# Ayah-Alma HAProxy Gateway
# Flow: Client TLS :443 -> HAProxy -> Nginx TLS/WebSocket -> Xray

global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 4096

    tune.ssl.default-dh-param 2048

defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 10s
    timeout client 1h
    timeout server 1h

frontend xray_tls_gateway
    bind :443
    mode tcp
    default_backend nginx_tls_backend

backend nginx_tls_backend
    mode tcp
    option tcp-check
    server nginx 127.0.0.1:8443 check
