# AYAH ALMA - HAProxy central TCP router with Nginx web fallback
# HAProxy owns public TCP listeners; Nginx is reachable only on 127.0.0.1:8080.

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 100000

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend ayah_http_80
    mode http
    bind :80
    bind :::80 v6only
    option forwardfor
    http-request set-header X-Forwarded-Proto http

    acl p_vmess_grpc path_beg /vmess-grpc
    acl p_vless_grpc path_beg /vless-grpc
    acl p_trojan_grpc path_beg /trojan-grpc
    acl p_ss_grpc path_beg /ss-grpc
    acl p_ssh_ws path_beg /ssh-ws
    acl p_vmess path_beg /vmess
    acl p_vless path_beg /vless
    acl p_trojan_ws path_beg /trojan-ws
    acl p_ss_ws path_beg /ss-ws
    acl p_upvmess path_beg /upvmess
    acl p_upvless path_beg /upvless
    acl p_uptrojan path_beg /uptrojan

    use_backend be_vmess_grpc if p_vmess_grpc
    use_backend be_vless_grpc if p_vless_grpc
    use_backend be_trojan_grpc if p_trojan_grpc
    use_backend be_ss_grpc if p_ss_grpc
    use_backend be_ssh_ws if p_ssh_ws
    use_backend be_upvmess if p_upvmess
    use_backend be_upvless if p_upvless
    use_backend be_uptrojan if p_uptrojan
    use_backend be_vmess_ws if p_vmess
    use_backend be_vless_ws if p_vless
    use_backend be_trojan_ws if p_trojan_ws
    use_backend be_ss_ws if p_ss_ws
    default_backend be_nginx_fallback

frontend ayah_https_443
    mode http
    bind :443 ssl crt /etc/haproxy/certs/ayah-alma.pem alpn h2,http/1.1
    bind :::443 v6only ssl crt /etc/haproxy/certs/ayah-alma.pem alpn h2,http/1.1
    option forwardfor
    http-request set-header X-Forwarded-Proto https

    acl p_vmess_grpc path_beg /vmess-grpc
    acl p_vless_grpc path_beg /vless-grpc
    acl p_trojan_grpc path_beg /trojan-grpc
    acl p_ss_grpc path_beg /ss-grpc
    acl p_ssh_ws path_beg /ssh-ws
    acl p_ssh_wss path_beg /ssh-wss
    acl p_vmess path_beg /vmess
    acl p_vless path_beg /vless
    acl p_trojan_ws path_beg /trojan-ws
    acl p_ss_ws path_beg /ss-ws
    acl p_upvmess path_beg /upvmess
    acl p_upvless path_beg /upvless
    acl p_uptrojan path_beg /uptrojan

    use_backend be_vmess_grpc if p_vmess_grpc
    use_backend be_vless_grpc if p_vless_grpc
    use_backend be_trojan_grpc if p_trojan_grpc
    use_backend be_ss_grpc if p_ss_grpc
    use_backend be_ssh_wss if p_ssh_wss
    use_backend be_ssh_ws if p_ssh_ws
    use_backend be_upvmess if p_upvmess
    use_backend be_upvless if p_upvless
    use_backend be_uptrojan if p_uptrojan
    use_backend be_vmess_ws_tls if p_vmess
    use_backend be_vless_ws_tls if p_vless
    use_backend be_trojan_ws_tls if p_trojan_ws
    use_backend be_ss_ws_tls if p_ss_ws
    default_backend be_nginx_fallback

# Default web backend for requests that do not match a tunneling route.
backend be_nginx_fallback
    mode http
    option httpchk GET /__health
    http-check expect status 200
    server nginx_fallback 127.0.0.1:8080 check

# ==========================================================
# WEBSOCKET BACKENDS (Dengan Suntikan Paksa Header Payload)
# ==========================================================
backend be_ssh_ws
    mode http
    timeout tunnel 1h
    http-request set-header Connection Upgrade
    http-request set-header Upgrade websocket
    server sshws 127.0.0.1:2082
backend be_ssh_wss
    mode http
    timeout tunnel 1h
    http-request set-header Connection Upgrade
    http-request set-header Upgrade websocket
    server sshwss 127.0.0.1:2096

backend be_vmess_ws
    mode http
    timeout tunnel 1h
    http-request set-header Connection Upgrade
    http-request set-header Upgrade websocket
    server vmess 127.0.0.1:23457
backend be_vless_ws
    mode http
    timeout tunnel 1h
    http-request set-header Connection Upgrade
    http-request set-header Upgrade websocket
    server vless 127.0.0.1:14017
backend be_trojan_ws
    mode http
    timeout tunnel 1h
    http-request set-header Connection Upgrade
    http-request set-header Upgrade websocket
    server trojan 127.0.0.1:25433
backend be_ss_ws
    mode http
    timeout tunnel 1h
    http-request set-header Connection Upgrade
    http-request set-header Upgrade websocket
    server ssws 127.0.0.1:30301

backend be_vmess_ws_tls
    mode http
    timeout tunnel 1h
    http-request set-header Connection Upgrade
    http-request set-header Upgrade websocket
    server vmesstls 127.0.0.1:23456
backend be_vless_ws_tls
    mode http
    timeout tunnel 1h
    http-request set-header Connection Upgrade
    http-request set-header Upgrade websocket
    server vlesstls 127.0.0.1:14016
backend be_trojan_ws_tls
    mode http
    timeout tunnel 1h
    http-request set-header Connection Upgrade
    http-request set-header Upgrade websocket
    server trojantls 127.0.0.1:25432
backend be_ss_ws_tls
    mode http
    timeout tunnel 1h
    http-request set-header Connection Upgrade
    http-request set-header Upgrade websocket
    server sswstls 127.0.0.1:30300

# HTTPUpgrade Backends
backend be_upvmess
    mode http
    timeout tunnel 1h
    server vmessup 127.0.0.1:14019
backend be_upvless
    mode http
    timeout tunnel 1h
    server vlessup 127.0.0.1:14018
backend be_uptrojan
    mode http
    timeout tunnel 1h
    server trojanup 127.0.0.1:14020

# gRPC backends use HTTP/2 to Xray.
backend be_vmess_grpc
    mode http
    timeout tunnel 1h
    server vmessgrpc 127.0.0.1:31234 proto h2
backend be_vless_grpc
    mode http
    timeout tunnel 1h
    server vlessgrpc 127.0.0.1:24456 proto h2
backend be_trojan_grpc
    mode http
    timeout tunnel 1h
    server trojangrpc 127.0.0.1:33456 proto h2
backend be_ss_grpc
    mode http
    timeout tunnel 1h
    server ssgrpc 127.0.0.1:30310 proto h2

# Raw TCP-TLS proxy and SSH SSL-only listeners. Dropbear 109/143 binds directly.
frontend ayah_tcp_vmess_tls
    mode tcp
    bind :10011
    bind :::10011 v6only
    default_backend be_tcp_vmess_tls
backend be_tcp_vmess_tls
    mode tcp
    server vmessraw 127.0.0.1:10001
frontend ayah_tcp_vless_tls
    mode tcp
    bind :10012
    bind :::10012 v6only
    default_backend be_tcp_vless_tls
backend be_tcp_vless_tls
    mode tcp
    server vlessraw 127.0.0.1:10002
frontend ayah_tcp_trojan_tls
    mode tcp
    bind :10013
    bind :::10013 v6only
    default_backend be_tcp_trojan_tls
backend be_tcp_trojan_tls
    mode tcp
    server trojanraw 127.0.0.1:10003
frontend ayah_tcp_ssh_ssl
    mode tcp
    bind :444
    bind :::444 v6only
    default_backend be_tcp_ssh_ssl
backend be_tcp_ssh_ssl
    mode tcp
    server sshssl 127.0.0.1:2222
