# AYAH ALMA - HAProxy central TCP router with Nginx web fallback
# HAProxy owns public TCP listeners; Nginx is reachable only on 127.0.0.1:8080.

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 100000

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend ayah_http_80
    mode http
    bind :80
    bind :::80 v6only
    option forwardfor
    http-request set-header X-Forwarded-Proto http

    acl p_vmess_grpc path_beg /vmess-grpc
    acl p_vless_grpc path_beg /vless-grpc
    acl p_trojan_grpc path_beg /trojan-grpc
    acl p_ss_grpc path_beg /ss-grpc
    acl p_ssh_ws path_beg /ssh-ws
    acl p_ssh_cgi path_beg /cdn-cgi/trace
    acl p_ssh_upgrade hdr(Upgrade) -i websocket
    acl p_ssh_conn_upgrade hdr(Connection) -m sub -i upgrade
    acl p_ssh_connect method CONNECT
    acl p_ssh_online hdr(X-Online-Host) -m found
    acl p_ssh_real hdr(X-Real-Host) -m found
    acl p_vmess path_beg /vmess
    acl p_vless path_beg /vless
    acl p_trojan_ws path_beg /trojan-ws
    acl p_ss_ws path_beg /ss-ws
    acl p_upvmess path_beg /upvmess
    acl p_upvless path_beg /upvless
    acl p_uptrojan path_beg /uptrojan

    # Mark SSH payload requests as upgrade before backend selection so HAProxy
    # switches to tunnel mode even when Injector payload omitted Upgrade headers.
    http-request set-header Connection Upgrade if p_ssh_ws or p_ssh_cgi or p_ssh_upgrade or p_ssh_conn_upgrade or p_ssh_online or p_ssh_real
    http-request set-header Upgrade websocket if p_ssh_ws or p_ssh_cgi or p_ssh_upgrade or p_ssh_conn_upgrade or p_ssh_online or p_ssh_real

    use_backend be_vmess_grpc if p_vmess_grpc
    use_backend be_vless_grpc if p_vless_grpc
    use_backend be_trojan_grpc if p_trojan_grpc
    use_backend be_ss_grpc if p_ss_grpc
    use_backend be_ssh_ws if p_ssh_ws
    use_backend be_ssh_ws if p_ssh_cgi
    use_backend be_upvmess if p_upvmess
    use_backend be_upvless if p_upvless
    use_backend be_uptrojan if p_uptrojan
    use_backend be_vmess_ws if p_vmess
    use_backend be_vless_ws if p_vless
    use_backend be_trojan_ws if p_trojan_ws
    use_backend be_ss_ws if p_ss_ws
    use_backend be_ssh_ws if p_ssh_upgrade
    use_backend be_ssh_ws if p_ssh_conn_upgrade
    use_backend be_ssh_ws if p_ssh_connect
    use_backend be_ssh_ws if p_ssh_online or p_ssh_real
    default_backend be_nginx_fallback

frontend ayah_https_443
    mode http
    bind :443 ssl crt /etc/haproxy/certs/ayah-alma.pem alpn h2,http/1.1
    bind :::443 v6only ssl crt /etc/haproxy/certs/ayah-alma.pem alpn h2,http/1.1
    option forwardfor
    http-request set-header X-Forwarded-Proto https

    acl p_vmess_grpc path_beg /vmess-grpc
    acl p_vless_grpc path_beg /vless-grpc
    acl p_trojan_grpc path_beg /trojan-grpc
    acl p_ss_grpc path_beg /ss-grpc
    acl p_ssh_ws path_beg /ssh-ws
    acl p_ssh_wss path_beg /ssh-wss
    acl p_ssh_cgi path_beg /cdn-cgi/trace
    acl p_ssh_upgrade hdr(Upgrade) -i websocket
    acl p_ssh_conn_upgrade hdr(Connection) -m sub -i upgrade
    acl p_ssh_connect method CONNECT
    acl p_ssh_online hdr(X-Online-Host) -m found
    acl p_ssh_real hdr(X-Real-Host) -m found
    acl p_vmess path_beg /vmess
    acl p_vless path_beg /vless
    acl p_trojan_ws path_beg /trojan-ws
    acl p_ss_ws path_beg /ss-ws
    acl p_upvmess path_beg /upvmess
    acl p_upvless path_beg /upvless
    acl p_uptrojan path_beg /uptrojan

    http-request set-header Connection Upgrade if p_ssh_ws or p_ssh_wss or p_ssh_cgi or p_ssh_upgrade or p_ssh_conn_upgrade or p_ssh_online or p_ssh_real
    http-request set-header Upgrade websocket if p_ssh_ws or p_ssh_wss or p_ssh_cgi or p_ssh_upgrade or p_ssh_conn_upgrade or p_ssh_online or p_ssh_real

    use_backend be_vmess_grpc if p_vmess_grpc
    use_backend be_vless_grpc if p_vless_grpc
    use_backend be_trojan_grpc if p_trojan_grpc
    use_backend be_ss_grpc if p_ss_grpc
    use_backend be_ssh_wss if p_ssh_wss
    use_backend be_ssh_wss if p_ssh_cgi
    use_backend be_ssh_ws if p_ssh_ws
    use_backend be_upvmess if p_upvmess
    use_backend be_upvless if p_upvless
    use_backend be_uptrojan if p_uptrojan
    use_backend be_vmess_ws_tls if p_vmess
    use_backend be_vless_ws_tls if p_vless
    use_backend be_trojan_ws_tls if p_trojan_ws
    use_backend be_ss_ws_tls if p_ss_ws
    use_backend be_ssh_wss if p_ssh_upgrade
    use_backend be_ssh_wss if p_ssh_conn_upgrade
    use_backend be_ssh_wss if p_ssh_connect
    use_backend be_ssh_wss if p_ssh_online or p_ssh_real
    default_backend be_nginx_fallback

# Default web backend for requests that do not match a tunneling route.
backend be_nginx_fallback
    mode http
    option httpchk GET /__health
    http-check expect status 200
    server nginx_fallback 127.0.0.1:8080 check

# ==========================================================
# SSH WebSocket payload backends
# ==========================================================
backend be_ssh_ws
    mode http
    timeout tunnel 1h
    server sshws 127.0.0.1:2082
backend be_ssh_wss
    mode http
    timeout tunnel 1h
    server sshwss 127.0.0.1:2096

backend be_vmess_ws
    mode http
    timeout tunnel 1h
    server vmess 127.0.0.1:23457
backend be_vless_ws
    mode http
    timeout tunnel 1h
    server vless 127.0.0.1:14017
backend be_trojan_ws
    mode http
    timeout tunnel 1h
    server trojan 127.0.0.1:25433
backend be_ss_ws
    mode http
    timeout tunnel 1h
    server ssws 127.0.0.1:30301

backend be_vmess_ws_tls
    mode http
    timeout tunnel 1h
    server vmesstls 127.0.0.1:23456
backend be_vless_ws_tls
    mode http
    timeout tunnel 1h
    server vlesstls 127.0.0.1:14016
backend be_trojan_ws_tls
    mode http
    timeout tunnel 1h
    server trojantls 127.0.0.1:25432
backend be_ss_ws_tls
    mode http
    timeout tunnel 1h
    server sswstls 127.0.0.1:30300

# HTTPUpgrade Backends
backend be_upvmess
    mode http
    timeout tunnel 1h
    server vmessup 127.0.0.1:14019
backend be_upvless
    mode http
    timeout tunnel 1h
    server vlessup 127.0.0.1:14018
backend be_uptrojan
    mode http
    timeout tunnel 1h
    server trojanup 127.0.0.1:14020

# gRPC backends use HTTP/2 to Xray.
backend be_vmess_grpc
    mode http
    timeout tunnel 1h
    server vmessgrpc 127.0.0.1:31234 proto h2
backend be_vless_grpc
    mode http
    timeout tunnel 1h
    server vlessgrpc 127.0.0.1:24456 proto h2
backend be_trojan_grpc
    mode http
    timeout tunnel 1h
    server trojangrpc 127.0.0.1:33456 proto h2
backend be_ss_grpc
    mode http
    timeout tunnel 1h
    server ssgrpc 127.0.0.1:30310 proto h2
