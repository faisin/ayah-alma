user www-data;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    multi_accept on;
    worker_connections 2048;
}

http {
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain application/x-javascript text/javascript application/octet-stream text/xml text/css application/json application/javascript application/x-www-form-urlencoded;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    charset UTF-8;
    source_charset UTF-8;
    charset_types text/plain application/octet-stream text/javascript application/json;
    keepalive_timeout 165;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    client_max_body_size 64M;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 64k;

    # Konfigurasi FastCGI (CGI) yang lengkap
    fastcgi_buffer_size 8m;
    fastcgi_buffers 10 8m;
    fastcgi_read_timeout 600;

    # Integrasi Cloudflare Real IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 198.143.32.0/19;
    set_real_ip_from 149.154.160.0/20;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/conf.d/*.conf;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
    add_header Strict-Transport-Security "max-age=999999999; includeSubDomains; preload";
}
