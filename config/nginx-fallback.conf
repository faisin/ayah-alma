# AYAH ALMA website backend. HAProxy is the only public HTTP/HTTPS entrypoint.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;

    root /var/www/ayah-alma;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/ayah-alma-access.log;
    error_log /var/log/nginx/ayah-alma-error.log warn;

    location = /__health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
