# Included as /etc/nginx/sites-available/ayah-alma-fallback.
# Nginx is a private web fallback behind HAProxy, never a public listener.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;

    root /var/www/ayah-alma;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/ayah-alma-access.log;
    error_log /var/log/nginx/ayah-alma-error.log warn;

    location = /__health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ==========================================================
    # BLOK ROUTING WEBSOCKET XRAY (Diteruskan dari HAProxy)
    # ==========================================================
    location /vmess {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:23457;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /vless {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:14017;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /trojan-ws {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:25433;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ss-ws {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:30301;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # ==========================================================

    # Panel Web Toko Anda (Hanya dieksekusi jika path tidak cocok dengan blok di atas)
    location / {
        try_files $uri $uri/ =404;
    }
}
