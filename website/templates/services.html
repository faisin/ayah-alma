<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Services - AYAH ALMA PANEL</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            background: #0b1120;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }

        .container { max-width: 900px; margin: auto; }

        .card {
            margin-top: 20px;
            padding: 22px;
            background: #111827;
            border: 1px solid #263244;
            border-radius: 12px;
        }

        h1 { font-size: 23px; }
        .muted { color: #9ca3af; }
        a { color: #93c5fd; text-decoration: none; }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid #263244;
        }

        .row:last-child { border-bottom: none; }

        @media (max-width: 480px) {
            body { padding: 14px; }
            .row { flex-direction: column; gap: 6px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <a href="/dashboard">← Kembali ke Dashboard</a>

        <h1>Status Layanan</h1>
        <p class="muted">Informasi status layanan pada VPS.</p>

        <section class="card">
            <div class="row">
                <span>SSH</span>
                <strong>{{ services.ssh }}</strong>
            </div>

            <div class="row">
                <span>Xray</span>
                <strong>{{ services.xray }}</strong>
            </div>

            <div class="row">
                <span>Nginx</span>
                <strong>{{ services.nginx }}</strong>
            </div>

            <div class="row">
                <span>HAProxy</span>
                <strong>{{ services.haproxy }}</strong>
            </div>
        </section>
    </main>
</body>
</html>
