<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Akun SSH - AYAH ALMA PANEL</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            background: #0b1120;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            margin-top: 20px;
            padding: 22px;
            background: #111827;
            border: 1px solid #263244;
            border-radius: 12px;
        }

        h1 { font-size: 23px; }
        .muted { color: #9ca3af; }
        a { color: #93c5fd; text-decoration: none; }

        .notice {
            padding: 14px;
            border: 1px solid #374151;
            border-radius: 8px;
            background: #1f2937;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            body { padding: 14px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <a href="/ssh/">← Kembali ke SSH Manager</a>

        <h1>Daftar Akun SSH</h1>
        <p class="muted">Pengelolaan akun SSH pada server.</p>

        <section class="card">
            <div class="notice">
                <strong>Fitur belum diaktifkan.</strong>
                <p>
                    Daftar akun akan ditampilkan setelah fungsi pembacaan
                    akun SSH diintegrasikan ke aplikasi.
                </p>
                <p>
                    Halaman ini belum membuat, mengubah, atau menghapus
                    akun SSH pada server.
                </p>
            </div>
        </section>
    </main>
</body>
</html>
