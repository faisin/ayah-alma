<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SSH Manager - AYAH ALMA PANEL</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            background: #0b1120;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }
        .container { max-width: 900px; margin: auto; }
        .card {
            margin-top: 20px;
            padding: 22px;
            background: #111827;
            border: 1px solid #263244;
            border-radius: 12px;
        }
        h1 { font-size: 23px; }
        .muted { color: #9ca3af; }
        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 6px;
            background: #064e3b;
            color: #a7f3d0;
        }
        .row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid #263244;
        }
        a { color: #93c5fd; text-decoration: none; }
        @media (max-width: 480px) {
            body { padding: 14px; }
            .row { flex-direction: column; gap: 6px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <a href="/">← Kembali ke Dashboard</a>
        <h1>SSH Manager</h1>
        <p class="muted">Informasi layanan SSH server.</p>

        <section class="card">
            <div class="row">
                <span>Status layanan</span>
                <strong>{{ ssh.status }}</strong>
            </div>
            <div class="row">
                <span>Port SSH</span>
                <strong>{{ ssh.port }}</strong>
            </div>
            <div class="row">
                <span>Pengelolaan akun</span>
                <strong>Belum diaktifkan</strong>
            </div>
        </section>
    </main>
</body>
</html>
