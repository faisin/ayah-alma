<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Manager - AYAH ALMA PANEL</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            background: #0b1120;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            margin-top: 20px;
            padding: 22px;
            background: #111827;
            border: 1px solid #263244;
            border-radius: 12px;
        }

        h1 { font-size: 23px; }
        .muted { color: #9ca3af; }
        a { color: #93c5fd; text-decoration: none; }

        .notice {
            padding: 14px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            body { padding: 14px; }
        }
    </style>
</head>

<body>
    <main class="container">
        <a href="/dashboard">← Kembali ke Dashboard</a>

        <h1>Admin Manager</h1>
        <p class="muted">Informasi pengelolaan administrator panel.</p>

        <section class="card">
            <div class="notice">
                <strong>Fitur belum diaktifkan.</strong>
                <p>
                    Pengelolaan administrator akan diaktifkan setelah
                    autentikasi dan hak akses panel selesai diintegrasikan.
                </p>
                <p>
                    Halaman ini belum bisa menambah, mengubah,
                    atau menghapus administrator.
                </p>
            </div>
        </section>
    </main>
</body>
</html>
