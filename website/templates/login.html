<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - AYAH ALMA PANEL</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0b1120;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            padding: 30px;
            background: #111827;
            border: 1px solid #263244;
            border-radius: 14px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 23px;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #9ca3af;
            text-align: center;
            font-size: 13px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
        }

        input {
            width: 100%;
            margin-bottom: 18px;
            padding: 12px;
            border: 1px solid #374151;
            border-radius: 7px;
            background: #0b1120;
            color: #fff;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #2563eb;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-bottom: 16px;
            padding: 10px;
            border-radius: 7px;
            background: #3f1d2e;
            color: #fecaca;
            font-size: 13px;
        }

        .footer {
            margin-top: 24px;
            color: #6b7280;
            text-align: center;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <main class="login-box">
        <h1>AYAH ALMA PANEL</h1>
        <div class="subtitle">Login Administrator</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">MASUK</button>
        </form>

        <div class="footer">
            AYAH ALMA PANEL &bull; Administrator
        </div>
    </main>
</body>
</html>
